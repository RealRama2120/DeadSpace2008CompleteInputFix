[Development]
; Enable only when collecting a support log. Normal gameplay uses concise startup logging.
DiagnosticsEnabled=0
SummaryIntervalMs=10000
IdleCalibrationSeconds=5

[ControllerExperiment]
; Phase 3 verified-game-response candidate. Only right-stick X/Y are transformed.
Enabled=1
PhysicalInnerDeadzone=0.11
CompensateGameDeadzone=1
GameInnerDeadzone=0.265175
; Used only when CompensateGameDeadzone=0 for legacy comparison profiles.
AntiDeadzone=0.14
PreserveSquareOuterRange=1

[MouseExperiment]
; Phase 4 EA-build release candidate. Menus and DirectInput polling remain vanilla.
Enabled=1
SensitivityOffset=0.01
StandardHorizontalScale=-0.001
StandardVerticalScale=0.001
ZeroGHorizontalScale=-0.0008333333
ZeroGVerticalScale=0.0008333333
